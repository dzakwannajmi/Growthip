[package]
name = "growthip-pool"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
growthip-merkle-verifier-v2 = { path = "../growthip-merkle-verifier-v2" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
hex = "0.4"
growthip-merkle-verifier-v3 = { path = "../growthip-merkle-verifier-v3" }
